[package]
name = "armature-metrics"
version = "0.3.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-metrics"
homepage = "https://quinnjr.github.io/armature"
description = "Prometheus metrics and monitoring for Armature"
keywords = ["metrics", "prometheus", "monitoring", "observability"]
categories = ["web-programming", "development-tools::profiling"]

[dependencies]
armature-core = { version = "0.9" }
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
prometheus = { version = "0.14", features = ["process"] }
once_cell = "1.21"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"

